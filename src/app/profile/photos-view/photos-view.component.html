<div class="main-wrapper">

    <app-header></app-header>
    <app-sidebar></app-sidebar>


    <div class="page-wrapper">
        <div class="content">


            <div class="page-header">
                <div class="page-title">
                    <h4>Photos Addition</h4>
                    <h6>Add/Update Photo</h6>
                </div>
            </div>




            <div class="row">
                <div class="col-lg-12">
                    <div class="form-group">



                        <div class="image-upload mb-2">
                            <input #fileInput type="file" (change)="onFileSelected($event)"
                                [disabled]="uploadedFiles.length>0" accept=".jpeg,.jpg" value="" multiple>
                            <div class="image-uploads">
                                <img *ngIf="uploadedFiles.length==0" src="assets/img/icons/upload.svg" alt="img">
                                <img *ngIf="uploadedFiles.length>0" src="assets/img/icons/check-2.svg" alt="img"
                                    width="25" height="25">
                                <h4 *ngIf="uploadedFiles.length==0">Drag and drop a file to upload</h4>
                                <h4 class="text-success" *ngIf="uploadedFiles.length>0">File Uploaded</h4>
                            </div>
                        </div>


                        <div class="d-flex justify-content-end">

                            <div class="page-btn">
                                <button class="btn btn-primary me-2" [disabled]="uploadedFiles.length==0"
                                    (click)="saveUploadFile()">&nbsp;Save&nbsp;</button>
                                <button class="btn btn-secondary" [disabled]="uploadedFiles.length==0"
                                    (click)="onFileCancel()">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>







            <div class="row">

                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-start">
                            <p class="card-title">Images</p>
                            <button class="btn btn-primary" [disabled]="imagesDeleteDataArray.length==0"   data-toggle="modal"
                                data-target="#exampleModalCenter">&nbsp;&nbsp;&nbsp;&nbsp;Delete&nbsp;&nbsp;&nbsp;&nbsp;</button>
                        </div>
                        <div class="card-body">
                            <div class="row" *ngIf="photosUrls && photosUrls.length!=0">
                                <div class="col-md-4 mb-2 mb-md-0 position-relative"
                                    *ngFor="let item of photosUrls ; let i=index;">
                                    <img [src]="item.photo" class="img-fluid" alt="image" (click)="imageView(item,i)"
                                    data-toggle="modal" data-target="#exampleModalCenter">
                                    <input type="checkbox" class="delete-checkbox"
                                        (change)="onImageSelect($event,item.id,i)">
                                </div>
                            </div>
                            <div *ngIf="photosUrls && photosUrls.length==0" class="row p-4">
                                <img src="assets/img/no_img_found.svg"  style="width: 200px; height: 200px;margin: auto;">
                                <h4 class="text-center">No Images Found</h4>
                                <!-- <h6 class="text-center">You can upload</h6> -->
                            </div>
                        </div>
                    </div>
                </div>

            </div>















        </div>
    </div>
</div>






<div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLongTitle">Are Your Sure to Delete ?</h5>

            </div>
            <div class="modal-body">

                <h6>This process is irreversible</h6>
            </div>
            <div class="modal-footer justify-content-end">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" data-dismiss="modal"
                    (click)="deletePhotos()">Delete</button>
            </div>
        </div>
    </div>
</div>
