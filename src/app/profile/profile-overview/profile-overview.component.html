<div class="main-wrapper">

    <app-header></app-header>
    <app-sidebar></app-sidebar>


    <div class="page-wrapper">
        <div class="content">
            <div class="page-header ">
                <div class="page-title">
                    <h4>Profile View</h4>
                </div>
            </div>


            <div class="accordion" id="accordionExample">

                <div class="accordion-item" *ngFor="let item of keys(vendorData) ; let i=index ">
                    <h2 class="accordion-header" [id]="'heading' + i">
                        <button class="accordion-button " [ngClass]="{'collapsed': i != 0}" type="button"
                            data-bs-toggle="collapse" [attr.data-bs-target]="'#collapse' + i" aria-expanded="false"
                            [attr.aria-controls]="'collapse' + i">
                            <span>{{item}}</span>


                        </button>
                    </h2>
                    <div [id]="'collapse' + i" class="accordion-collapse collapse" [ngClass]="{'show': i === 0}"
                        [attr.aria-labelledby]="'heading' + i" data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                            <div class="text-end">
                                <span class="badges bg-lightgreen me-2"
                                    (click)="editBranch(vendorData[item])">Edit</span>

                                <img src="assets/img/icons/delete.svg" alt="img" class="align-middle"
                                    *ngIf="item!='Main'" (click)="getDeletedBranch(vendorData[item])"
                                    data-toggle="modal" data-target="#exampleModalCenter">
                            </div>

                            <form class="row">

                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>Business Name</label>
                                        <input type="text" [value]="vendorData[item]['business_name']">
                                    </div>
                                </div>

                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>Business Branch</label>
                                        <input type="text" [value]="vendorData[item]['business_name']">
                                    </div>
                                </div>

                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>Business Type</label>
                                        <input type="text" [value]="vendorData[item]['business_type']">
                                    </div>
                                </div>



                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>Mobile No.</label>
                                        <input type="text" [value]="vendorData[item]['registered_mobile_no']">
                                    </div>
                                </div>



                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>Email</label>
                                        <input type="text" [value]="vendorData[item]['registered_email']">
                                    </div>
                                </div>



                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>Address</label>
                                        <input type="text" [value]="vendorData[item]['registered_address']">
                                    </div>
                                </div>



                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>Country</label>
                                        <input type="text" [value]="vendorData[item]['country']">
                                    </div>
                                </div>



                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>State</label>
                                        <input type="text" [value]="vendorData[item]['state']">
                                    </div>
                                </div>



                                <div class=" col-sm-4 col-12">
                                    <div class="form-group pe-none">
                                        <label>City</label>
                                        <input type="text" [value]="vendorData[item]['city']">
                                    </div>
                                </div>










                            </form>

                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>







<!-- Delete Confirmation Popup -->




<div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLongTitle">Are Your Sure to Delete ?</h5>

            </div>
            <div class="modal-body">

                <h6>This process is irreversible</h6>
            </div>
            <div class="modal-footer justify-content-end">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" data-dismiss="modal"
                    (click)="deleteBranch()">Delete</button>
            </div>
        </div>
    </div>
</div>
